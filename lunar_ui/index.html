<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lunar´s Fahrzeugvermietung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background layers -->
    <div class="bg-layer">
        <div class="bg-grid"></div>
        <div class="bg-scanlines"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
        <div class="bg-noise"></div>
    </div>

    <div id="app" class="hidden">
        <div class="container">
            <!-- Decorative corner brackets -->
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>

            <header class="header">
                <div class="brand">
                    <div class="logo-wrap">
                        <div class="logo-ring"></div>
                        <div class="logo">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="34" height="34">
                                <path d="M5 17h14M6.5 17l1.2-4.5A2 2 0 0 1 9.6 11h4.8a2 2 0 0 1 1.9 1.5L17.5 17M4 17v2m16-2v2M7 14h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="8" cy="17" r="1.4" stroke="currentColor" stroke-width="1.5"/>
                                <circle cx="16" cy="17" r="1.4" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </div>
                    </div>
                    <div class="brand-text">
                        <div class="brand-tag">// SYSTEM ONLINE</div>
                        <h1>Lunar<span class="accent-dot">´</span>s Fahrzeugvermietung</h1>
                        <p>Premium Fahrzeugvermietung <span class="divider-dot"></span> Los Santos District</p>
                    </div>
                </div>
                <div class="header-controls">
                    <div class="search-bar">
                        <span class="search-icon">
                            <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </span>
                        <input id="searchInput" type="text" placeholder="Fahrzeuge suchen...">
                        <span class="search-shortcut">ESC</span>
                    </div>
                    <button id="closeBtn" class="close-btn" aria-label="Schließen">
                        <span>×</span>
                    </button>
                </div>
            </header>

            <main class="main-content">
                <div id="grid" class="vehicle-grid"></div>
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" width="42" height="42"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </div>
                    <h3>Keine Fahrzeuge gefunden</h3>
                    <p>Versuche es mit anderen Suchbegriffen oder einer anderen Kategorie.</p>
                </div>
            </main>

            <footer class="footer-bar">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span>Verbindung stabil</span>
                </div>
                <div class="footer-meta">
                    <span id="vehicleCount">0 Fahrzeuge verfügbar</span>
                    <span class="divider-dot"></span>
                    <span>v2.0 · LUNAR</span>
                </div>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
