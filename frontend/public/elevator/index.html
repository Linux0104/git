<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrstuhl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="shell" id="app" aria-hidden="true">
        <div class="shell-glow"></div>

        <header class="shell-header">
            <div class="brand">
                <div class="brand-badge" id="brandBadge">
                    <svg viewBox="0 0 48 56" aria-hidden="true" focusable="false">
                        <defs>
                            <linearGradient id="badgeStroke" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#7fe4ff"></stop>
                                <stop offset="1" stop-color="#2aa8dd"></stop>
                            </linearGradient>
                        </defs>
                        <path d="M24 2 L44 9 V27 C44 41 35 50 24 54 C13 50 4 41 4 27 V9 Z"
                              fill="rgba(60,207,255,0.10)" stroke="url(#badgeStroke)" stroke-width="2" stroke-linejoin="round"></path>
                        <path d="M24 15 l3.1 6.6 7.3 0.9 -5.4 4.9 1.5 7.1 -6.5 -3.6 -6.5 3.6 1.5 -7.1 -5.4 -4.9 7.3 -0.9 Z"
                              fill="#3ccfff"></path>
                    </svg>
                </div>
                <div class="brand-copy">
                    <span class="kicker" id="kickerLabel">Sektor</span>
                    <h1 class="brand-title"><span class="chevron">&gt;</span><span id="buildingLabel">Fahrstuhl</span></h1>
                    <p class="brand-sub" id="buildingSubline" hidden></p>
                </div>
            </div>

            <div class="header-side">
                <div class="stat-box">
                    <span class="stat-label">Aktuelle Etage</span>
                    <span class="stat-value" id="currentFloorLabel">--</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Etagen</span>
                    <span class="stat-value" id="floorCount">0</span>
                </div>
                <div class="stat-box" id="badgeStat" hidden>
                    <span class="stat-label">Objekt</span>
                    <span class="stat-value" id="buildingBadge"></span>
                </div>
                <button type="button" class="close-btn" id="closeBtn" aria-label="Schliessen">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="list-head">
            <span class="section-label" id="hintLabel">Waehle eine Etage</span>
            <span class="section-line"></span>
        </div>

        <div class="floor-grid" id="floorList"></div>

        <div class="message-bar" id="messageBar" hidden></div>
    </div>

    <script src="./assets/js/app.js"></script>
</body>
</html>
