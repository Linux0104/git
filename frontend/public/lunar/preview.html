<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Menu — Preview</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Backdrop only for preview (simulates in-game) */
        html, body {
            background:
                radial-gradient(1200px 600px at 20% 30%, rgba(0,170,255,0.10), transparent 60%),
                radial-gradient(900px 500px at 80% 70%, rgba(0,80,160,0.12), transparent 65%),
                #05080d;
        }
        .preview-tip {
            position: fixed;
            top: 16px;
            right: 16px;
            color: #8aa0b8;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            background: rgba(0,170,255,0.08);
            border: 1px solid rgba(0,170,255,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        .preview-tip b { color: #cfe7f8; }
    </style>
</head>
<body>
    <div class="preview-tip">PREVIEW — <b>↑ ↓</b> Navigation · <b>← →</b> Slider/Liste · <b>Enter</b> Auswahl</div>

    <div id="app" style="display: none;">
        <div class="menu-container">
            <div class="container-glow" aria-hidden="true"></div>

            <div class="banner-header">
                <div class="banner-overlay" aria-hidden="true"></div>
                <img src="https://customer-assets.emergentagent.com/job_376c957f-4650-4b84-910e-b32ba4d464b9/artifacts/0z2u86z6_2dffc62f-3007-4427-b14e-d6dac0aeec6e.jpg" alt="Header" id="header-img">
            </div>

            <div class="title-bar">
                <span class="menu-title" id="menu-title">MENU</span>
                <span class="menu-count" id="menu-count">0/0</span>
            </div>

            <div class="stats-container" id="stats-container" style="display: none;">
                <div class="stat-row">
                    <span class="stat-label">Deine Visumstufe:</span>
                    <span class="stat-value" id="visum-level">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Deine Spielzeit:</span>
                    <span class="stat-value" id="playtime">0 Std.</span>
                </div>
            </div>

            <div class="menu-items-scroll-container">
                <div class="menu-items" id="menu-items"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Demo-Daten — simuliert openMenu vom Game-Client
        window.postMessage({
            action: 'openMenu',
            namespace: 'lunar',
            name: 'personal',
            data: {
                title: 'PERSÖNLICH',
                isPersonalMenu: true,
                visum: 3,
                playtime: 127,
                elements: [
                    { label: 'Personalausweis zeigen', value: 'id' },
                    { label: 'Führerschein zeigen',    value: 'license' },
                    { label: 'Waffenschein zeigen',    value: 'weapon' },
                    { label: 'Visum prüfen',           value: 'visum' },
                    { label: 'Durchsuchen',            value: 'search' },
                    { label: 'Handschellen anlegen',   value: 'cuffs' },
                    { label: 'Person tragen',          value: 'carry' },
                    { label: 'Identität ändern',       value: 'identity' },
                    { label: 'Lautstärke', type: 'slider', value: 7, min: 0, max: 10 },
                    { label: 'Sprache', type: 'list', value: 0, options: [
                        { label: 'Deutsch' },
                        { label: 'English' },
                        { label: 'Français' }
                    ]},
                    { label: 'Einstellungen', value: 'settings' },
                    { label: 'Extras', value: 'extras' }
                ]
            }
        }, '*');
    </script>
</body>
</html>
